[project]
name = "squatwatch"
version = "0.1.0"
description = "Typosquat and dependency-confusion detector for npm and PyPI manifests, lockfiles and package archives."
readme = "README.md"
license = "MIT"
authors = [{ name = "squatwatch contributors" }]
requires-python = ">=3.12"
dependencies = [
    "numpy==2.3.4",
    "packaging==25.0",
]

[project.scripts]
squatwatch = "squatwatch.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis==6.142.1",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["examples/archives-src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N", "S", "BLE", "C4", "PTH", "RET", "ARG"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "S101",      # asserts are fine in tests
    "RUF001",    # confusable glyphs are this project's subject matter
    "RUF002",
    "RUF003",
    "PLC0415",
    "PLR1730",   # explicit comparisons are faster than min() in the DP inner loop
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "ARG", "PTH", "N802"]
"scripts/**" = ["S310", "PTH", "T201", "E402"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "scripts"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["squatwatch"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
